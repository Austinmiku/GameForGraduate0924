 {title:"海上十字路口",unit:"臺灣的地理位置與文化",icon:"🧭",enemy:"航線迷霧",enemyIcon:"🌫️",artifact:"古航海圖",artifactIcon:"🗺️",card:"航海羅盤",intro:["緊急！典藏庫的八件核心文物被『抹除者』打散了。牠認為歷史只需要一個答案。","第一張古航海圖失去方向。找回臺灣的位置線索，才能啟動守護航線。"],spots:[{t:"世界地圖桌",i:"🌏",d:"觀察臺灣與亞洲、太平洋的位置。",c:"臺灣位在亞洲東部、太平洋西側，鄰近東亞與東南亞的海上路線。"},{t:"港口望遠鏡",i:"🔭",d:"看看船隻與文化如何往來。",c:"海洋讓人、貨物與文化交流；島嶼不是孤立，而是連接各地。"}],fact:"古航海圖能顯示不同時代的人如何認識海洋與航線。地圖也是理解交流的重要證據。",outro:"第一條航線亮起，但抹除者讓城市裡的人忘了如何一起生活。下一件文物正在法治廣場呼救！",qs:[

 {title:"共同生活的約定",unit:"社會規範與法律",icon:"⚖️",enemy:"爭吵噪音",enemyIcon:"💢",artifact:"公平秤砣",artifactIcon:"⚖️",card:"線索放大鏡",intro:["法治廣場一片混亂：有人插隊，有人破壞展品，大家只會大聲責怪彼此。","找出規範與法律各自的作用，讓人們重新學會溝通。"],spots:[{t:"生活約定牆",i:"🤝",d:"牆上有風俗、道德、宗教與團體約定。",c:"社會規範有不同形式，能引導行為；遇到差異時要理性溝通、尊重包容。"},{t:"權利守護站",i:"🛡️",d:"查看法律如何保障生活。",c:"法律保障權利、維持秩序；人民與政府都必須依法行事。"}],fact:"秤象徵公平。規範幫助大家相處，法律則由國家制定並有強制力，用來保障權利與維持秩序。",outro:"廣場恢復秩序。抹除者逃向地形工坊，正把山地和平原的位置全部交換！",qs:[

function prepare(n){state.level=n;state.entry++;state.spotOrder=shuffled([0,1],n*31+state.entry);const available=items.filter(x=>x.unlock<=state.unlocked),limit=n===8?2:1;state.selectedItems=available.slice(-limit).map(x=>x.id);const l=levels[n-1],d=difficulties[n-1];render(`<section class="screen"><div class="eyebrow">第 ${n} 關・${esc(l.unit)}</div><h2>${l.icon} ${esc(l.title)}</h2><div class="two"><div class="panel dialogue"><span class="speaker">檔檔・文物嚮導</span><p>${esc(l.intro[0])}</p><p>${esc(l.intro[1])}</p></div><div class="panel"><h3>選擇本關道具</h3><p>${n===8?"最終 Boss 可攜帶兩件道具。":"本關可攜帶一件道具。"}<br>難度：<b>${d.name}</b><br>敵人 ${d.enemy} HP・攻擊 ${d.attack}<br>守護心上限 ${d.hearts}</p><span class="tag" id="itemCount">已選 ${state.selectedItems.length} / ${limit}</span></div></div><div class="item-grid">${available.map(x=>`<button class="item ${state.selectedItems.includes(x.id)?"selected":""}" data-item="${x.id}"><span>${x.icon}</span><b>${esc(x.name)}</b><small>${esc(itemEffect(x.id,n))}</small></button>`).join("")}</div><div class="row"><button class="secondary" id="back">返回地圖</button><button class="primary" id="go">帶著道具出發</button></div></section>`);document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{const id=b.dataset.item,pos=state.selectedItems.indexOf(id);if(pos>=0){if(state.selectedItems.length>1)state.selectedItems.splice(pos,1)}else if(state.selectedItems.length<limit)state.selectedItems.push(id);else state.selectedItems=[...state.selectedItems.slice(1),id];document.querySelectorAll(".item").forEach(x=>x.classList.toggle("selected",state.selectedItems.includes(x.dataset.item)));document.querySelector("#itemCount").textContent=`已選 ${state.selectedItems.length} / ${limit}`});document.querySelector("#back").onclick=showMap;document.querySelector("#go").onclick=startExplore}

function random(seed){if(!params.has("seed"))return Math.random;let x=(+params.get("seed")||115)+seed;return()=>{x|=0;x=x+0x6D2B79F5|0;let t=Math.imul(x^x>>>15,1|x);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(list,salt=0){const a=[...list],rng=random(salt);for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderBattle(message="選出最合理的答案。第一次答錯會得到提示，還能再選一次。"){const l=levels[state.level-1],q=state.deck[state.qi],equipped=state.selectedItems.map(id=>items.find(x=>x.id===id)),d=difficulties[state.level-1];render(`<section class="screen"><div class="eyebrow">證據戰鬥・本輪第 ${state.qi+1} / 6 題・${d.name}</div><div class="battle-grid"><aside class="enemy"><div class="enemy-icon">${l.enemyIcon}</div><h2>${esc(l.enemy)}</h2><div>迷霧強度 ${state.enemy} / ${state.enemyMax}</div><div class="bar"><div class="fill" style="width:${state.enemy/state.enemyMax*100}%"></div></div><div>敵人攻擊 ${state.enemyAttack}・守護心 ${state.hp} / ${state.hpMax}</div><div class="hearts">${"❤️".repeat(state.hp)}${"🖤".repeat(state.hpMax-state.hp)}</div></aside><div class="battle-card"><div>${equipped.map(it=>`<span class="tag">${it.icon} ${esc(it.name)}・${esc(itemEffect(it.id))}</span>`).join(" ")}</div><h3 class="question">${esc(q.text)}</h3><div class="answers">${q.choices.map((a,i)=>`<button class="answer" data-a="${i}">${String.fromCharCode(65+i)}　${esc(a.text)}</button>`).join("")}</div><div class="status" id="status" aria-live="polite">${esc(message)}</div><div class="battle-actions">${equipped.map(it=>`<button class="secondary" data-use="${it.id}" ${state.usedItems.has(it.id)?"disabled":""}>${state.usedItems.has(it.id)?`${it.icon} 已使用`:`使用 ${it.icon} ${esc(it.name)}`}</button>`).join("")}</div></div></div></section>`);document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(+b.dataset.a));document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>useItem(b.dataset.use))}
function removeWrong(buttons,q,count){buttons.filter(b=>+b.dataset.a!==q.correct&&!b.disabled).slice(0,count).forEach(b=>{b.disabled=true;b.style.opacity=.35})}
function useItem(id){if(state.usedItems.has(id))return;const q=state.deck[state.qi],buttons=[...document.querySelectorAll(".answer")],late=state.level>=5;state.usedItems.add(id);if(id==="compass"){const count=late?2:1;removeWrong(buttons,q,count);setStatus(`羅盤排除了 ${count} 個錯誤方向。`)}

function setStatus(s){document.querySelector("#status").textContent=s}
function answer(choice){const q=state.deck[state.qi],buttons=[...document.querySelectorAll(".answer")];if(choice===q.correct){buttons.forEach(b=>b.disabled=true);buttons[choice].classList.add("correct");const dmg=state.armed||1;state.armed=0;state.enemy=Math.max(0,state.enemy-dmg);setStatus(`答對了！${q.explain}${dmg>1?` 證據印章造成 ${dmg} 點傷害。`:""}`);setTimeout(nextTurn,850)}else{buttons[choice].classList.add("wrong");buttons[choice].disabled=true;if(state.attempt===0){state.attempt=1;setStatus(`提示：${q.hint} 再選一次。`)}else{buttons.forEach(b=>b.disabled=true);buttons[q.correct].classList.add("correct");if(state.shield>0){state.shield--;setStatus(`沙漏擋住了 ${state.enemyAttack} 點傷害，還能抵擋 ${state.shield} 次。${q.explain}`)}else{state.hp=Math.max(0,state.hp-state.enemyAttack);setStatus(`敵人造成 ${state.enemyAttack} 點傷害。正確答案已標示。${q.explain}`)}setTimeout(nextTurn,1000)}}}
function nextTurn(){if(state.enemy<=0)return showReward();if(state.hp<=0)return showLose();state.qi++;state.attempt=0;if(state.qi>=state.deck.length){state.qi=0;state.entry++;state.deck=makeDeck()}renderBattle()}
function showLose(){const l=levels[state.level-1];render(`<section class="screen reward"><div class="big">🧩</div><div class="eyebrow">證據還差一點</div><h2>${esc(l.enemy)}尚未完全修復</h2><p>沒關係，失敗不會扣除進度。重新整理線索，再試一次。</p><div class="row" style="justify-content:center"><button class="secondary" id="explore">重看探索線索</button><button class="primary" id="retry">重新挑戰</button></div></section>`);document.querySelector("#explore").onclick=renderExplore;document.querySelector("#retry").onclick=startBattle}
function showReward(){const l=levels[state.level-1];state.done.add(state.level);state.unlocked=Math.max(state.unlocked,Math.min(8,state.level+1));save();render(`<section class="screen reward"><div class="eyebrow">第 ${state.level} 關修復完成</div><div class="artifact-card"><div class="big">${l.artifactIcon}</div><h2>${esc(l.artifact)}</h2><div class="tag">知識卡・${esc(l.card)}</div><p class="fact">${esc(l.fact)}</p></div><div class="panel dialogue"><span class="speaker">檔檔・文物嚮導</span>${esc(l.outro)}</div><div style="margin-top:20px"><button class="primary" id="continue">${state.level===8?"觀看守護行動結局":"前往下一關"}</button></div></section>`);document.querySelector("#continue").onclick=()=>state.level===8?showFinal():prepare(state.level+1)}
function showFinal(){render(`<section class="screen"><div class="eyebrow">合・守護行動完成</div><h2>八件文物都回來了</h2><div class="finale"><p>最後一題答對後，金色的光照亮整座博物館。古航海圖重新畫出航線，地形模型恢復原狀，季風曆也再次開始運作。八件文物回到展櫃，一起說出臺灣的故事。</p><p>黑霧慢慢散去。抹除者變回一張老舊的資料卡，上面寫著：「把所有資料分成同一類。」</p><div class="story-quote"><b>抹除者：</b>「我以為刪掉不同的說法，就不會有人爭吵。可是這些不同的線索，為什麼可以拼成一個完整故事？」</div><p><b>檔檔回答：</b>「因為每一份資料都只能告訴我們一部分事情。把地圖、文物、環境和人的記憶放在一起，我們才能更了解過去。」</p><p>你把一張空白資料卡交給抹除者，請牠不要再刪除故事，而是好好記下資料從哪裡來。抹除者點點頭，為自己取了新名字：<b>「故事記錄員」</b>。</p></div><div class="ending-grid"><article class="ending-card"><div class="big">🌊</div><h3>海洋帶來交流</h3><p>臺灣四面環海。海洋不只把地方隔開，也能讓人、物品和文化互相交流。</p></article><article class="ending-card"><div class="big">🌿</div><h3>環境影響生活</h3><p>地形、氣候和資源會影響人們住在哪裡、做什麼工作，以及如何保護環境。</p></article><article class="ending-card"><div class="big">📚</div><h3>線索幫助我們了解過去</h3><p>文物和歷史資料都很重要。比較不同線索，能讓我們看見更完整的故事。</p></article></div><div class="epilogue"><h3>尾聲・新的守護任務</h3><p>博物館重新開門後，展牌旁多了一個問題：「你還想知道誰的故事？」孩子們開始提問，長輩分享回憶，研究人員也繼續尋找新的資料。大家一起讓故事變得更完整。</p><p>檔檔把守護者徽章送給你。牠說：「遊戲雖然結束了，守護任務還沒有結束。當你願意查清楚一段消息、尊重不同想法，或保護自然與文物時，你就是一位真正的守護員。」</p><div class="vow"><b>守護員誓詞</b><br>我會查清楚資料，聽聽不同的想法；<br>珍惜自然和文物，並用行動保護它們。</div></div><div class="feedback-box"><h3>請留下試玩回饋</h3><p>可以選擇多個答案。資料只會保存在這台瀏覽器。</p><div class="feedback-buttons">${[["readable","文字容易理解"],["fun","我願意繼續玩"],["long","有些內容太長"],["hard","有些題目太難"]].map(x=>`<button class="secondary ${state.feedback[x[0]]?"chosen":""}" data-f="${x[0]}">${x[1]}</button>`).join("")}</div><p id="thanks" aria-live="polite"></p></div><div class="row" style="margin-top:22px"><button class="secondary" id="map">回到關卡地圖</button><button class="primary" id="replay">再次觀看結局</button></div></section>`);document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.f;state.feedback[k]=!state.feedback[k];b.classList.toggle("chosen",state.feedback[k]);save();document.querySelector("#thanks").textContent="謝謝！你的回饋已記錄。"});document.querySelector("#map").onclick=showMap;document.querySelector("#replay").onclick=showFinal}
function selfCheck(){const errors=[];if(levels.length!==8)errors.push("關卡不是 8 關");levels.forEach((l,i)=>{if(l.qs.length!==6)errors.push(`第 ${i+1} 關題數錯誤`);if(l.spots.length!==2)errors.push(`第 ${i+1} 關探索點錯誤`);l.qs.forEach((q,j)=>{if(q[1].length!==4||q[2]<0||q[2]>3)errors.push(`第 ${i+1}-${j+1} 題格式錯誤`)})});difficulties.forEach((d,i)=>{if(i&&d.enemy<difficulties[i-1].enemy)errors.push("敵人血量未逐關提高");if(i&&d.attack<difficulties[i-1].attack)errors.push("敵人攻擊未逐關提高");if(d.attack<1||d.hearts<=d.attack)errors.push(`第 ${i+1} 關平衡值錯誤`)});if(difficulties.at(-1).attack!==4)errors.push("最終關攻擊力不是 4");if(document.querySelectorAll(".feedback-box").length)errors.push("回饋不應出現在初始畫面");console.info(errors.length?errors:"Self-check passed: shuffled 8-level campaign with scaling combat.");return errors}
document.querySelector("#largeBtn").onclick=()=>{document.body.classList.toggle("large");document.querySelector("#largeBtn").textContent=document.body.classList.contains("large")?"一般文字":"放大文字"};document.querySelector("#homeBtn").onclick=showMap;
selfCheck();const debug=+params.get("level");if(debug>=1&&debug<=8){state.unlocked=8;prepare(debug)}else if(params.has("map")){showMap()}else showPrologue(0);
</script>
</body>
