function toggleSfx(){sfxOn=!sfxOn;try{localStorage.setItem(SFX_KEY,sfxOn?"on":"off")}catch{}const b=$b("#sfxBtn");if(b){b.setAttribute("aria-pressed",String(sfxOn));b.textContent=sfxOn?"音效：開":"音效：關"}if(sfxOn)sfxPlay("item")}
/* 魔杖頂端座標：插畫版依 battle-hero.webp 中法杖寶珠位置（圖片寬 91.2%、高 14.6%）；SVG 版取 .hero-gem */
function staffTip(){const st=$b(".bt-stage"),hs=$b(".hero-sprite");if(!st||!hs)return null;const s=st.getBoundingClientRect(),painted=hs.classList.contains("painted"),el=painted?hs.querySelector(".hero-paint"):hs.querySelector(".hero-gem");if(!el)return null;const r=el.getBoundingClientRect();if(!r.width)return null;return painted?{x:r.left-s.left+r.width*.912,y:r.top-s.top+r.height*.146}:{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2}}
function foeCore(){const f=$b(".foe-sprite");if(!f)return null;const s=$b(".bt-stage").getBoundingClientRect(),r=f.getBoundingClientRect();return {x:r.left-s.left+r.width*.5,y:r.top-s.top+r.height*.48}}
function fxAt(p,cls,ms){const fx=$b("#fx");if(!fx||!p)return null;const n=document.createElement("div");n.className=cls;n.style.left=p.x+"px";n.style.top=p.y+"px";fx.append(n);setTimeout(()=>n.remove(),ms);return n}
async function animHeroAttack(dmg,defeated){const foe=$b("#foe"),ally=$b("#ally"),l=levels[state.level-1],crit=dmg>1;battleLog(crit?"證據印章加持！魔杖凝聚關鍵證據！":"答對了！守護員舉起魔杖，凝聚證據之光！");
 fxClass(ally,"cast",1000);sfxPlay("cast");
 const tip0=staffTip();fxAt(tip0,"bt-charge-orb"+(crit?" crit":""),520);fxAt(tip0,"bt-charge-ring",520);await wait(480);
 const tip=staffTip()||tip0,core=foeCore()||foe;fxAt(tip,"bt-muzzle",360);sfxPlay("item");fxShot(tip||ally,core,"gold"+(crit?" big":""),420);await wait(420);
 sfxPlay(crit?"crit":"hit");fxClass(foe,"hit",560);fxAt(core,"bt-impact"+(crit?" crit":""),700);fxBurst(foe,"ring");if(crit){fxClass($b(".bt-stage"),"shake",460);fxFlash("gold")}else fxClass($b(".bt-stage"),"shake-sm",260);fxPop(foe,`-${dmg}`,crit?"crit":"dmg-foe");updateFoeGauge();updateParty();await wait(700);
 if(defeated){battleLog(`${l.enemy}被驅散了！被偷走的文物回來了！`);sfxPlay("win");foe.classList.add("collapse");await wait(650);const painted=$b(".foe-sprite.painted"),relic=!painted&&foe.querySelector(".foe-relic");fxShot(relic||core,ally,"relic",750);await wait(760);fxBurst(ally,"ring");ally.classList.add("victory");await wait(600)}}
async function animFoeAttack(blocked,down,lostFrom){const foe=$b("#foe"),ally=$b("#ally"),l=levels[state.level-1];foe.classList.remove("charging");battleLog(`${l.enemy}發動「迷霧衝擊」！`);sfxPlay("enemy");fxClass(foe,"lunge",680);await wait(270);fxShot(foe,ally,"ink",400);await wait(400);if(blocked){sfxPlay("block");fxBurst(ally,"shield");fxPop(ally,"擋下！","block");battleLog("時序沙漏擋下了這次攻擊！")}else{sfxPlay("hurt");fxClass(ally,"hurt",620);fxClass($b(".bt-stage"),"shake",460);fxFlash("red");fxBurst(ally,"ink");fxPop(ally,`-${state.enemyAttack}`,"dmg-ally")}updateParty(blocked?undefined:lostFrom);await wait(750);if(down){battleLog("守護心用完了……先撤退，重新整理線索！");sfxPlay("lose");ally.classList.add("down");await wait(900)}}
function startBattle(){const d=difficulties[state.level-1];state.qi=0;state.deck=makeDeck();state.enemy=state.enemyMax=d.enemy;state.enemyAttack=d.attack;state.hp=state.hpMax=d.hearts;state.attempt=0;state.usedItems=new Set();state.armed=0;state.shield=0;state.battleIntro=true;renderBattle()}
function renderBattle(message="選出最合理的答案。第一次答錯會得到提示，還能再選一次。"){const l=levels[state.level-1],q=state.deck[state.qi],equipped=state.selectedItems.map(id=>items.find(x=>x.id===id)).filter(Boolean),d=difficulties[state.level-1],n=state.level,nn=String(n).padStart(2,"0"),intro=!!state.battleIntro;state.battleIntro=false;state.busy=false;
 render(`<section class="screen battle-screen lv-${n}${intro?" is-intro":""}" aria-label="證據戰鬥">
 <div class="bt-stage" style="--bb:url('assets/explore-scene-${nn}.png')">
  <div class="bt-bg" aria-hidden="true"></div>
  <div class="rm-win bt-plate"><div class="bt-name">${esc(l.enemy)}<small>歷史竊盜者</small></div><span class="bt-gauge foe-gauge" role="progressbar" aria-label="敵人迷霧強度" aria-valuemin="0" aria-valuemax="${state.enemyMax}" aria-valuenow="${state.enemy}"><i style="width:${state.enemy/state.enemyMax*100}%"></i></span><div class="bt-meta"><span>迷霧強度 <b id="foeHp">${state.enemy} / ${state.enemyMax}</b></span><span>攻擊 <b>${state.enemyAttack}</b></span></div></div>
  <div class="rm-win bt-round"><b>第 ${state.qi+1} / ${QUESTIONS_PER_BATTLE} 題</b><span>難度・${esc(d.name)}</span><button class="bt-sound" id="sfxBtn" type="button" aria-pressed="${sfxOn}">${sfxOn?"音效：開":"音效：關"}</button></div>
  <div class="rm-win bt-log" id="battleLog" aria-hidden="true">${intro?`${esc(l.enemy)}擋住了去路！`:"守護員的回合：選出正確的證據！"}</div>
  <div class="bt-foe" id="foe"><div class="bt-sprite foe-sprite"><img class="foe-paint" src="assets/battle-enemy-${nn}.webp" alt="" onload="this.parentNode.classList.add('painted')" onerror="this.remove()">${foeSvg(n)}</div><div class="bt-shadow"></div></div>
  <div class="bt-ally${state.shield>0?" shielded":""}${state.armed>0?" armed":""}" id="ally"><div class="bt-bubble"></div><div class="dd-sprite"><img src="assets/battle-dangdang.webp" alt=""></div><div class="bt-sprite hero-sprite"><img class="hero-paint" src="assets/battle-hero.webp" alt="" onload="this.parentNode.classList.add('painted')" onerror="this.remove()">${HERO_SVG}</div><div class="bt-shadow"></div></div>
  <div class="bt-flash" id="btFlash"></div><div class="bt-fx" id="fx" aria-hidden="true"></div>
  ${intro?`<div class="bt-banner" aria-hidden="true"><span>${esc(l.enemy)}<small>出現了！</small></span></div>`:""}
 </div>
 <div class="bt-hud">
  <div class="rm-win bt-question"><div class="bt-qhead"><span>證據問題・第 ${state.qi+1} 題</span><span class="bt-qintent">答對：攻擊敵人｜同題答錯兩次：守護心 -${state.enemyAttack}</span></div><h3 class="question">${esc(q.text)}</h3><div class="answers">${q.choices.map((a,i)=>`<button class="answer" type="button" data-a="${i}"><span class="answer-letter">${String.fromCharCode(65+i)}</span><span>${esc(a.text)}</span><span class="answer-state"></span></button>`).join("")}</div><div class="bt-msgrow"><div class="status" id="status" role="status" aria-live="polite">${esc(message)}</div><div id="btNextWrap"></div></div></div>
  <div class="bt-side">
   <div class="rm-win bt-party"><h4>見習守護員<small>檔檔同行</small></h4><div class="bt-hearts" id="heroHearts" aria-hidden="true"></div><span class="bt-gauge hp hero-gauge" role="progressbar" aria-label="守護心" aria-valuemin="0" aria-valuemax="${state.hpMax}" aria-valuenow="${state.hp}"><i style="width:${state.hp/state.hpMax*100}%"></i></span><div class="bt-meta"><span>守護心 <b id="heroHp">${state.hp} / ${state.hpMax}</b></span></div><div class="bt-buffs" id="buffs"></div></div>
   <div class="rm-win bt-cmd"><h4>道具<small>每場各一次</small></h4><div class="bt-items">${equipped.length?equipped.map(it=>`<button type="button" data-use="${it.id}" ${state.usedItems.has(it.id)?"disabled":""}>${itemArt(it,"item-mini-art")}<span><b>${state.usedItems.has(it.id)?`${esc(it.name)}・已使用`:`使用 ${esc(it.name)}`}</b><small>${esc(itemEffect(it.id))}</small></span></button>`).join(""):`<p class="bt-noitem">這場沒有攜帶道具。</p>`}</div></div>
  </div>
 </div></section>`);
 updateParty();document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(+b.dataset.a));document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>useItem(b.dataset.use));$b("#sfxBtn").onclick=toggleSfx;
 if(intro)sfxPlay("encounter")}
function removeWrong(buttons,q,count){buttons.filter(b=>+b.dataset.a!==q.correct&&!b.disabled).slice(0,count).forEach(b=>{b.disabled=true;b.classList.add("eliminated");b.querySelector(".answer-state").textContent="已排除"})}
function itemFx(id,amount){const ally=$b("#ally"),it=items.find(x=>x.id===id);if(!ally||!it)return;fxItem(ally,it.image);const logs={compass:"航海羅盤轉動，指出錯誤的方向！",lens:"線索放大鏡照出關鍵提示！",kit:"修復工具箱修好了守護心！",sand:"時序沙漏張開了防護罩！",stamp:"證據印章蓄力中，下一擊威力加倍！"};battleLog(logs[id]);if(id==="kit"){sfxPlay("heal");fxBurst(ally,"heal");if(amount)fxPop(ally,`+${amount}`,"heal")}else if(id==="sand"){sfxPlay("block");fxBurst(ally,"shield")}else{sfxPlay("item");fxBurst(ally,"ring")}updateParty()}
function useItem(id){if(state.usedItems.has(id)||state.busy)return;const q=state.deck[state.qi],buttons=[...document.querySelectorAll(".answer")],late=state.level>=5;state.usedItems.add(id);if(id==="compass"){const count=late?2:1;removeWrong(buttons,q,count);setStatus(`羅盤排除了 ${count} 個錯誤方向。`)}
 else if(id==="lens"){if(late)removeWrong(buttons,q,1);setStatus(`提示：${q.hint}${late?" 並已排除一個錯誤選項。":""}`)}
 else if(id==="kit"){if(state.hp===state.hpMax){state.usedItems.delete(id);setStatus("守護心目前是滿的，工具箱留到受傷後再用。");return}const before=state.hp,heal=state.level>=7?state.hpMax:state.level>=4?3:2;state.hp=Math.min(state.hpMax,state.hp+heal);renderBattle(`工具箱修復了守護心，目前 ${state.hp} / ${state.hpMax}。`);itemFx(id,state.hp-before);return}
 else if(id==="sand"){state.shield=state.level>=7?2:1;setStatus(`沙漏已啟動：可以抵擋 ${state.shield} 次敵人攻擊。`)}
 else {state.armed=state.level>=8?3:2;setStatus(`證據印章蓄力完成：下一次答對造成 ${state.armed} 點傷害。`)}
 const b=document.querySelector(`[data-use="${id}"]`);if(b){const it=items.find(x=>x.id===id);b.disabled=true;b.innerHTML=`${itemArt(it,"item-mini-art")}<span><b>${esc(it.name)}・已使用</b><small>${esc(itemEffect(id))}</small></span>`}itemFx(id)}
function setStatus(s){document.querySelector("#status").textContent=s}
function answer(choice){if(state.busy)return;const q=state.deck[state.qi],buttons=[...document.querySelectorAll(".answer")];if(choice===q.correct){state.busy=true;lockBattleItems();buttons.forEach(b=>b.disabled=true);buttons[choice].classList.add("correct");buttons[choice].querySelector(".answer-state").textContent="答對";const dmg=state.armed||1;state.armed=0;state.enemy=Math.max(0,state.enemy-dmg);setStatus(`答對了！${q.explain}${dmg>1?` 證據印章造成 ${dmg} 點傷害。`:""}`);const defeated=state.enemy<=0;animHeroAttack(dmg,defeated).then(()=>showContinue(defeated?"取回文物":"下一題",nextTurn))}else{buttons[choice].classList.add("wrong");buttons[choice].querySelector(".answer-state").textContent=state.attempt===0?"答錯・請再選一次":"答錯";buttons[choice].disabled=true;if(state.attempt===0){state.attempt=1;setStatus(`提示：${q.hint} 再選一次。`);const foe=$b("#foe");if(foe)foe.classList.add("charging");battleLog(`${levels[state.level-1].enemy}正在蓄力！再答錯會受到 ${state.enemyAttack} 點傷害！`);sfxPlay("charge")}else{state.busy=true;lockBattleItems();buttons.filter(b=>b.classList.contains("wrong")).forEach(b=>b.querySelector(".answer-state").textContent="答錯");buttons.forEach(b=>b.disabled=true);buttons[q.correct].classList.add("correct");buttons[q.correct].querySelector(".answer-state").textContent="正確答案";const lostFrom=state.hp;let blocked=false;if(state.shield>0){state.shield--;blocked=true;setStatus(`沙漏擋住了 ${state.enemyAttack} 點傷害，還能抵擋 ${state.shield} 次。${q.explain}`)}else{state.hp=Math.max(0,state.hp-state.enemyAttack);setStatus(`敵人造成 ${state.enemyAttack} 點傷害。正確答案已標示。${q.explain}`)}const down=state.hp<=0;animFoeAttack(blocked,down,lostFrom).then(()=>showContinue(down?"繼續":"下一題",nextTurn))}}}
function nextTurn(){if(state.enemy<=0)return showReward();if(state.hp<=0)return showLose();state.qi++;state.attempt=0;if(state.qi>=state.deck.length){state.qi=0;state.entry++;state.deck=makeDeck()}renderBattle()}
function showLose(){const l=levels[state.level-1];render(`<section class="screen reward"><div class="big" aria-hidden="true">🧩</div><div class="eyebrow">證據還差一點</div><h2>${esc(l.enemy)}尚未完全修復</h2><p>沒關係，失敗不會扣除進度。重新整理線索，再試一次。</p><div class="row" style="justify-content:center"><button class="secondary" id="explore">重看探索線索</button><button class="primary" id="retry">重新挑戰</button></div></section>`);document.querySelector("#explore").onclick=renderExplore;document.querySelector("#retry").onclick=startBattle}
function showReward(){const l=levels[state.level-1];state.done.add(state.level);state.unlocked=Math.max(state.unlocked,Math.min(8,state.level+1));save();render(`<section class="screen reward"><div class="eyebrow">第 ${state.level} 關修復完成</div><div class="artifact-card"><div class="big" aria-hidden="true">${l.artifactIcon}</div><h2>${esc(l.artifact)}</h2><div class="tag">知識卡・${esc(l.card)}</div><p class="fact">${esc(l.fact)}</p></div><div class="panel dialogue"><span class="speaker">檔檔・文物嚮導</span>${esc(l.outro)}</div><div style="margin-top:20px"><button class="primary" id="continue">${state.level===8?"觀看守護行動結局":"前往下一關"}</button></div></section>`);document.querySelector("#continue").onclick=()=>state.level===8?showFinal():prepare(state.level+1)}
function showFinal(){render(`<section class="screen"><div class="eyebrow">合・守護行動完成</div><h2>八件文物都回來了</h2><div class="finale"><p>最後一題答對後，金色的光照亮整座博物館。古航海圖重新畫出航線，地形模型恢復原狀，季風曆也再次開始運作。八件文物回到展櫃，一起說出臺灣的故事。</p><p>黑霧慢慢散去。抹除者變回一張老舊的資料卡，上面寫著：「把所有資料分成同一類。」</p><div class="story-quote"><b>抹除者：</b>「我以為刪掉不同的說法，就不會有人爭吵。可是這些不同的線索，為什麼可以拼成一個完整故事？」</div><p><b>檔檔回答：</b>「因為每一份資料都只能告訴我們一部分事情。把地圖、文物、環境和人的記憶放在一起，我們才能更了解過去。」</p><p>你把一張空白資料卡交給抹除者，請牠不要再刪除故事，而是好好記下資料從哪裡來。抹除者點點頭，為自己取了新名字：<b>「故事記錄員」</b>。</p></div><div class="ending-grid"><article class="ending-card"><div class="big" aria-hidden="true">🌊</div><h3>海洋帶來交流</h3><p>臺灣四面環海。海洋不只把地方隔開，也能讓人、物品和文化互相交流。</p></article><article class="ending-card"><div class="big" aria-hidden="true">🌿</div><h3>環境影響生活</h3><p>地形、氣候和資源會影響人們住在哪裡、做什麼工作，以及如何保護環境。</p></article><article class="ending-card"><div class="big" aria-hidden="true">📚</div><h3>線索幫助我們了解過去</h3><p>文物和歷史資料都很重要。比較不同線索，能讓我們看見更完整的故事。</p></article></div><div class="epilogue"><h3>尾聲・新的守護任務</h3><p>博物館重新開門後，展牌旁多了一個問題：「你還想知道誰的故事？」孩子們開始提問，長輩分享回憶，研究人員也繼續尋找新的資料。大家一起讓故事變得更完整。</p><p>檔檔把守護者徽章送給你。牠說：「遊戲雖然結束了，守護任務還沒有結束。當你願意查清楚一段消息、尊重不同想法，或保護自然與文物時，你就是一位真正的守護員。」</p><div class="vow"><b>守護員誓詞</b><br>我會查清楚資料，聽聽不同的想法；<br>珍惜自然和文物，並用行動保護它們。</div></div><div class="feedback-box"><h3>請留下試玩回饋</h3><p>可以選擇多個答案。資料只會保存在這台瀏覽器。</p><div class="feedback-buttons">${[["readable","文字容易理解"],["fun","我願意繼續玩"],["long","有些內容太長"],["hard","有些題目太難"]].map(x=>`<button class="secondary ${state.feedback[x[0]]?"chosen":""}" data-f="${x[0]}" aria-pressed="${!!state.feedback[x[0]]}">${x[1]}</button>`).join("")}</div><p id="thanks" aria-live="polite"></p></div><div class="row" style="margin-top:22px"><button class="secondary" id="map">回到關卡地圖</button><button class="primary" id="replay">再次觀看結局</button></div></section>`);document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const k=b.dataset.f;state.feedback[k]=!state.feedback[k];b.classList.toggle("chosen",state.feedback[k]);b.setAttribute("aria-pressed",String(state.feedback[k]));save();document.querySelector("#thanks").textContent="謝謝！你的回饋已記錄。"});document.querySelector("#map").onclick=showMap;document.querySelector("#replay").onclick=showFinal}
function selfCheck(){const errors=[];if(levels.length!==8)errors.push("關卡不是 8 關");levels.forEach((l,i)=>{if(l.qs.length!==10)errors.push(`第 ${i+1} 關題庫不是 10 題`);if(new Set(l.qs.map(q=>q[0])).size!==l.qs.length)errors.push(`第 ${i+1} 關有重複題目`);if(l.spots.length!==2)errors.push(`第 ${i+1} 關探索點錯誤`);l.qs.forEach((q,j)=>{if(q[1].length!==4||q[2]<0||q[2]>3)errors.push(`第 ${i+1}-${j+1} 題格式錯誤`)});const sample=drawQuestionIndexes(l.qs.length,i);if(sample.length!==QUESTIONS_PER_BATTLE||new Set(sample).size!==QUESTIONS_PER_BATTLE)errors.push(`第 ${i+1} 關抽題數量錯誤`)});difficulties.forEach((d,i)=>{if(i&&d.enemy<difficulties[i-1].enemy)errors.push("敵人血量未逐關提高");if(i&&d.attack<difficulties[i-1].attack)errors.push("敵人攻擊未逐關提高");if(d.attack<1||d.hearts<=d.attack)errors.push(`第 ${i+1} 關平衡值錯誤`)});if(difficulties.at(-1).attack!==4)errors.push("最終關攻擊力不是 4");if(document.querySelectorAll(".feedback-box").length)errors.push("回饋不應出現在初始畫面");console.info(errors.length?errors:"Self-check passed: 80-question pool, 6 random questions per battle.");return errors}
document.querySelector("#largeBtn").onclick=()=>{const large=document.body.classList.toggle("large"),button=document.querySelector("#largeBtn");button.textContent=large?"一般文字":"放大文字";button.setAttribute("aria-pressed",String(large))};document.querySelector("#homeBtn").onclick=showMap;document.querySelector("#titleBtn").onclick=showTitle;
selfCheck();const debug=+params.get("level");if(debug>=1&&debug<=8){state.unlocked=8;prepare(debug)}else if(params.has("map")){showMap()}else showPrologue(0);
